<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Fitness Gym</title>
<link rel="stylesheet" href="styles.css">
  <!-- MISMA FUENTE DE TU WEB -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
  
</head>

<body>

<!-- NAV -->
<nav class="barra-navegacion navbar navbar-expand-lg" style="margin-top: -4.5em;">
  <div class="container" >
    <a class="navbar-brand text-white fw-bold" href="index.html">Fitness Gym</a>

    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav ms-auto gap-3">
        <li><a class="nav-link text-white" href="actividades.html">Actividades</a></li>
        <li><a class="nav-link text-white" href="contacto.html">Contacto</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- LOGIN -->
<div class="login-container">

  <div class="login-card">

    <h2 class="login-title">Fitness Gym</h2>
    <p class="login-subtitle">Registrate con estos datos</p>

    <form action="">
      <div class="input-group">
        <label>Nombre</label>
        <input type="text" placeholder="Introduce tu nombre">
      </div>
      <div class="input-group">
        <label>Apellidos</label>
        <input type="text" placeholder="Introduce tus Apellidos">
      </div>
      <div class="input-group">
        <label>Gmail</label>
        <input type="text" placeholder="Introduce tu gmail">
      </div>
      <div class="input-group">
        <label>Contraseña</label>
        <input type="password" placeholder="Introduce tu contraseña">
      </div>
      <div class="input-group">
        <label>Repite la contraseña</label>
        <input type="password" placeholder="Introduce tu contraseña">
      </div>
      <button type="submit" class="boton-principal btn-login">
        Registrate
      </button>
    </form>

    <p class="login-footer">
      ¿Tienes cuenta? <a href="login.html">Inicia Sesion</a>
    </p>

  </div>

</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
